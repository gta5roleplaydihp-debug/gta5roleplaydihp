<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thinkmay Cloud</title>

<link rel="manifest" href="manifest.json">

<style>
html,body{
  margin:0;
  padding:0;
  background:#000;
  width:100%;
  height:100%;
  overflow:hidden;
}
iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>
<body>

<!-- CLOUD -->
<iframe
  src="https://www.thinkmay.net"
  allow="microphone; camera; fullscreen"
></iframe>

<script>
/* =========================
   POPUP + HIDE CURSOR
========================= */
(function () {

  var popup = document.createElement("div");
  popup.innerHTML = `
    <div id="tm-popup-overlay">
      <div id="tm-popup">
        <img src="https://i.imgur.com/7tkRRcQ.jpeg" class="tm-logo">
        <div class="tm-text">
          <b>Aplikasi by</b><br>
          TikTok @gta5roleplaydihandphone
        </div>
        <div class="tm-timer">
          Popup tertutup dalam <span id="tm-count">5</span> detik
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(popup);

  var style = document.createElement("style");
  style.innerHTML = `
    #tm-popup-overlay{
      position:fixed; inset:0;
      background:rgba(0,0,0,.9);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
    }
    #tm-popup{
      background:#000;
      border:2px solid cyan;
      padding:20px;
      border-radius:12px;
      color:cyan;
      text-align:center;
    }
    .tm-logo{
      width:80px;
      border-radius:50%;
      margin-bottom:10px;
    }
  `;
  document.head.appendChild(style);

  var t = 5;
  var timer = setInterval(()=>{
    t--;
    document.getElementById("tm-count").innerText=t;
    if(t<=0){
      clearInterval(timer);
      document.getElementById("tm-popup-overlay").remove();
    }
  },1000);

  /* HIDE CURSOR */
  var check = setInterval(()=>{
    if(document.querySelector("iframe")){
      document.body.style.cursor="none";
      clearInterval(check);
    }
  },500);

})();
</script>

<script>
/* SERVICE WORKER */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
